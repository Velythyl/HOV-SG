name: Publish HOV-SG image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/velythyl/hovsg

jobs:
  docker-amd64:
    runs-on: ubuntu-22.04
    outputs:
      sha_tag: ${{ steps.sha.outputs.tag }}
    steps:
      # The CUDA + PyTorch image is ~10 GB unpacked; the stock runner has ~14 GB free.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Short SHA tag
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOVSG_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hovsg-cuda-amd64
          cache-to: type=gha,mode=max,scope=hovsg-cuda-amd64,ignore-error=true

      - name: Disk usage after build
        if: always()
        run: df -h /

  # CPU-only end-to-end run of the published image on a synthetic scene. It uses
  # the smoke profile (SAM ViT-B, fewer SAM prompts); CLIP stays ViT-H-14 because
  # upstream's precomputed label features are ViT-H-14 features.
  smoke-cpu:
    needs: docker-amd64
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/hovsg-weights
          key: hovsg-weights-vith14-samvitb-v1

      - name: Pull image
        run: docker pull "$IMAGE:${{ needs.docker-amd64.outputs.sha_tag }}"

      - name: Smoke test (up_axis=z)
        env:
          HOVSG_WEIGHTS_CACHE: /home/runner/hovsg-weights
          SMOKE_WORK: /home/runner/smoke-z
          UP_AXIS: z
          FRAMES: "18"
        run: bash smoke/run_smoke.sh "$IMAGE:${{ needs.docker-amd64.outputs.sha_tag }}" docker

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            /home/runner/smoke-z/output/run.json
            /home/runner/smoke-z/output/objects.jsonl
            /home/runner/smoke-z/output/rooms.jsonl
            /home/runner/smoke-z/output/floors.jsonl
            /home/runner/smoke-z/output/crops
          if-no-files-found: warn
